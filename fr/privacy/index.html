        <h1 data-i18n="privacy.title">Privacy Policy</h1>
        <p class="pf-legal-meta" data-i18n="privacy.updated">Pulse Flow · Last updated: 2 September 2026</p>

        <p data-i18n="privacy.intro">This Privacy Policy explains how Pulse Flow collects, uses, and shares information when you use pulseflow.site, app.pulseflow.site, and related services (the "Service").</p>

        <h2 data-i18n="privacy.summary_title">Summary</h2>
        <ul>
          <li data-i18n="privacy.summary_li1">We collect account, operations, and technical data needed to run the Service.</li>
          <li data-i18n="privacy.summary_li2">We use data to authenticate you, deliver features, and send notifications.</li>
          <li data-i18n="privacy.summary_li3">We share data with infrastructure providers, the payment processor when billing is enabled, and teammates according to role.</li>
          <li data-i18n="privacy.summary_li4">We do not sell your personal information.</li>
        </ul>

        <h2 data-i18n="privacy.audiences_title">By role</h2>

        <h3 data-i18n="privacy.guest_title">Stay guests</h3>
        <ul>
          <li data-i18n="privacy.guest_li1">We store date requests, quotes, stays, deposit status, briefings, and Support chat (including /deposit and /cancel).</li>
          <li data-i18n="privacy.guest_li2">Receipt images in Support are stored in cloud storage.</li>
          <li data-i18n="privacy.guest_li3">Your host and their team can see booking and Support data for your stay.</li>
        </ul>

        <h3 data-i18n="privacy.owner_title">Owners and managers</h3>
        <ul>
          <li data-i18n="privacy.owner_li1">We process property inventory, tasks, contacts, team chat, bills, reports, guest stays, and billing metadata for your organization.</li>
          <li data-i18n="privacy.owner_li2">Guest Support messages and deposit records are visible to authorized owners and managers.</li>
          <li data-i18n="privacy.owner_li3">Payment customer and subscription IDs are stored on the organization; card numbers are handled by the payment processor.</li>
        </ul>

        <h3 data-i18n="privacy.staff_title">Field staff</h3>
        <ul>
          <li data-i18n="privacy.staff_li1">We store your profile, assigned properties, job confirmations, tasks, team chat, endorsements, and submitted bills.</li>
          <li data-i18n="privacy.staff_li2">Receipt photos for expenses are stored in cloud storage.</li>
          <li data-i18n="privacy.staff_li3">A staff search listing is optional and may be visible to owners and managers searching in the app.</li>
          <li data-i18n="privacy.staff_li4">Guest stay data stays limited to hosts and that guest.</li>
        </ul>

        <h2 data-i18n="privacy.s4_title">Retention and security</h2>
        <p data-i18n="privacy.s4_body">We retain data while your organization is active and for a reasonable period afterward for backups, disputes and legal compliance. We use encrypted transport and access controls. You can request account deletion; some records may be retained where the law requires it.</p>

        <h2 data-i18n="privacy.s5_title">Your choices</h2>
        <ul>
          <li data-i18n="privacy.s5_li1">Update profile and organization settings in the app</li>
          <li data-i18n="privacy.s5_li2">Manage or cancel company billing via the billing portal when available</li>
          <li data-i18n="privacy.s5_li3">Contact us to access, correct, or delete personal data where applicable</li>
        </ul>

        <h2 data-i18n="privacy.s6_title">International use and children</h2>
        <p data-i18n="privacy.s6_body">Data may be processed outside your home country, in the regions our providers operate in. The Service is intended for business operations and is not directed at children under 16.</p>

        <h2 data-i18n="privacy.s7_title">Changes</h2>
        <p data-i18n="privacy.s7_body">We may update this Policy and post a revised date. Continued use means you accept the updated Policy.</p>

        <h2 data-i18n="privacy.s8_title">Contact</h2>
        <p data-i18n="privacy.s8_body">Privacy questions: <a href="mailto:support@pulseflow.site">support@pulseflow.site</a>. See also our <a href="/fr/terms">Terms of Service</a>.</p>
