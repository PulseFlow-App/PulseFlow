        <section class="pf-owners-hero is-text-only" id="hero">
          <p class="pf-owners-badge" data-i18n="owners.badge">For property owners</p>
          <h1 class="pf-headline" data-i18n="owners.headline">Know what is happening without asking</h1>
          <p class="pf-sub" data-i18n="owners.sub">Occupancy, urgent work, check-ins and every cost by property. You, your manager and the people on site are looking at the same thing.</p>
          <div class="pf-owners-hero-actions">
            <a class="pf-btn-primary" href="https://app.pulseflow.site/register" data-i18n="owners.cta_start">Start free</a>
            <a class="pf-owners-link" href="https://app.pulseflow.site/login?demo=owner" data-i18n="owners.cta_demo">Open the owner demo</a>
          </div>
          <p class="pf-free-note" data-i18n="owners.free_note">You are the only one who pays. Managers, field staff and guests are free.</p>
        </section>

        <section class="pf-alt" id="alternative" aria-labelledby="alt-title">
          <h2 id="alt-title" data-i18n="common.alt_title">What breaks today</h2>
          <ul class="pf-alt-list">
            <li data-i18n="owners.alt_1">Status has to be requested, and the answer depends on who last looked at their phone.</li>
            <li data-i18n="owners.alt_2">Costs get reconciled from photos of receipts in a thread, at month end, from memory.</li>
            <li data-i18n="owners.alt_3">A manager moves on, and the vendor numbers and the arrangements go with them.</li>
          </ul>
        </section>

                <p data-i18n="owners.f2_desc">Staff send an expense with a photo of the receipt, you approve it with one tap. Filter by period, property and category, and read three numbers: total, paid, pending. Twenty currencies with conversion.</p>

                <h2 data-i18n="owners.f3_title">A job somebody actually accepted</h2>
                <p data-i18n="owners.f3_desc">The job goes out with a description, a property and a work window. Whoever is on the app confirms it with a tap and you see the status change. For the ones who would rather be called, call or message from the same contact card: phone, WhatsApp, LINE.</p>

<section class="pf-faq" id="faq" aria-labelledby="faq-title">
          <h2 id="faq-title" data-i18n="common.faq_title">Short answers</h2>
          <details>
            <summary data-i18n="owners.faq_q1">I already have Airbnb and Booking. Why another thing?</summary>
            <p data-i18n="owners.faq_a1">This is not about bookings or pricing. Those stay where they are. Check-in and check-out dates are entered by hand, and importing them from Google Calendar is planned. There is no direct sync with Airbnb or Booking.</p>
          </details>
          <details>
            <summary data-i18n="owners.faq_q2">My team will never use it.</summary>
            <p data-i18n="owners.faq_a2">They open it from a link, with no app store and no new account. What they get is their own screen: their properties, their jobs, in their language. Team seats are free, so trying it costs neither of you anything.</p>
          </details>
          <details>
            <summary data-i18n="owners.faq_q3">What about guest money?</summary>
            <p data-i18n="owners.faq_a3">Payments and deposits go directly to you, outside the app. The app records the deposit, each deduction with a photo, and the balance, and your guest sees exactly the same. No payment runs through the app.</p>
          </details>
        </section>

        <section class="pf-soon" id="soon" aria-labelledby="soon-title">
          <h2 id="soon-title" data-i18n="owners.soon_title">What the app does not do</h2>
          <ul>
            <li data-i18n="owners.soon_1">Import bookings from Google Calendar. Planned. Dates are entered by hand today.</li>
            <li data-i18n="owners.soon_2">Take payment inside a booking request. The guest asks for dates, you agree price and payment yourselves.</li>
            <li data-i18n="owners.soon_3">Connect directly to Airbnb or Booking. Not today and not on the near roadmap.</li>
          </ul>
        </section>

        </section>
