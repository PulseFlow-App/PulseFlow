            <li data-i18n="home.alt_1">You send a job and have no idea whether anyone picked it up until you call.</li>

        <section class="pf-faq" id="faq" aria-labelledby="faq-title">
          <h2 id="faq-title" data-i18n="home.faq_title">Short answers</h2>
          <details>
            <summary data-i18n="home.faq_q1">Everything is on Airbnb and Booking. Does this replace them?</summary>
            <p data-i18n="home.faq_a1">No. Bookings stay where they are. Pulse Flow is about what happens after the booking: who cleans, what broke, what it cost, and what the guest can see. Check-in and check-out dates are entered by hand today. Importing bookings from Google Calendar is planned. There is no direct sync with Airbnb or Booking.</p>
          </details>
          <details>
            <summary data-i18n="home.faq_q2">What does it cost?</summary>
            <p data-i18n="home.faq_a2">A personal workspace is free forever. For a company, only the owner pays, and team seats are free. Billing is not live yet, so every registered account has 3 months of full access.</p>
          </details>
          <details>
            <summary data-i18n="home.faq_q3">My cleaners will never install an app.</summary>
            <p data-i18n="home.faq_a3">There is nothing to install from a store. It opens from a link in the browser and goes onto the phone's home screen in one step. No Google account, no App Store, just an email address. The interface follows the language each person picks, and so do the jobs and the chat.</p>
          </details>
          <details>
            <summary data-i18n="home.faq_q4">Do guests have to install anything?</summary>
            <p data-i18n="home.faq_a4">No, a guest opens the link their host sends. No payment goes through the app: deposits and payments go straight to the host, and the app records the amount, the deductions and the balance so both sides see the same thing.</p>
          </details>
        </section>
