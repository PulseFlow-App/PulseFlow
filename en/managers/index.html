        <section class="pf-owners-hero is-text-only" id="hero">
          <p class="pf-owners-badge" data-i18n="managers.badge">For property managers</p>
          <h1 class="pf-headline" data-i18n="managers.headline">Build the day once, not again in every chat</h1>
          <p class="pf-sub" data-i18n="managers.sub">What is urgent, who is on site, which check-ins are coming and which bills are open. Your owner sees the same thing and stops asking.</p>
          <div class="pf-owners-hero-actions">
            <a class="pf-btn-primary" href="https://app.pulseflow.site/register" data-i18n="managers.cta_start">Start free</a>
            <a class="pf-owners-link" href="https://app.pulseflow.site/login?demo=manager" data-i18n="managers.cta_demo">Open the manager demo</a>
          </div>
          <p class="pf-free-note" data-i18n="managers.free_note">Your seat is free. The company owner pays.</p>
        </section>

        <section class="pf-alt" id="alternative" aria-labelledby="alt-title">
          <h2 id="alt-title" data-i18n="common.alt_title">What breaks today</h2>
          <ul class="pf-alt-list">
            <li data-i18n="managers.alt_1">The plan for the day gets rebuilt across three chats every morning.</li>
            <li data-i18n="managers.alt_2">The owner asks for status and you reassemble the answer by hand.</li>
            <li data-i18n="managers.alt_3">The cleaner never saw the message, and you find out from the guest.</li>
          </ul>
        </section>

        <section class="pf-guide-section">
          <div class="pf-guide-daily">
            <article class="pf-guide-flagship" id="f1">
              <div class="pf-guide-flagship-copy">
                <h2 data-i18n="managers.f1_title">What is urgent today</h2>
                <p data-i18n="managers.f1_desc">Readiness, occupancy, turnovers between stays and urgent work on one screen. Below it, the week's check-ins and the volume of open work, without rebuilding the plan in a thread.</p>
              </div>
              <div class="pf-phone-solo">
                <figure class="pf-phone">
                  <div class="pf-phone-screen">
                    <img
                      src="/assets/screenshots/manager-home.png"
                      width="472"
                      height="1024"
                      alt="Manager home screen: readiness, check-ins and urgent work"
                      data-i18n-attr="alt:managers.f1_alt"
                      loading="eager"
                    />
                  </div>
                </figure>
              </div>
            </article>
            <article class="pf-guide-flagship" id="f2">
              <div class="pf-guide-flagship-copy">
                <h2 data-i18n="managers.f2_title">The job went out and somebody took it</h2>
                <p data-i18n="managers.f2_desc">What, where and when, in one send. Anyone on the app confirms with a tap and both you and the owner see it. Anyone easier to reach by phone, reach from the same card: call, WhatsApp, LINE.</p>
              </div>
              <div class="pf-phone-solo">
                <figure class="pf-phone">
                  <div class="pf-phone-screen">
                    <img
                      src="/assets/screenshots/manager-order.png"

                      height="1024"

                      data-i18n-attr="alt:managers.f2_alt"
                      loading="lazy"
                    />
                  </div>
                </figure>
              </div>
            </article>
            <article class="pf-guide-flagship" id="f3">
              <div class="pf-guide-flagship-copy">
                <h2 data-i18n="managers.f3_title">The report builds itself out of what already happened</h2>
                <p data-i18n="managers.f3_desc">Tasks, bills, check-ins and work for a period export by category or all at once. The weekly handover stops being something you type up on Friday.</p>
              </div>
              <div class="pf-phone-solo">

                      loading="lazy"
                    />
                  </div>
                </figure>
              </div>
            </article>

<section class="pf-faq" id="faq" aria-labelledby="faq-title">
          <h2 id="faq-title" data-i18n="common.faq_title">Short answers</h2>
          <details>
            <summary data-i18n="managers.faq_q1">One more system to keep updated by hand.</summary>
            <p data-i18n="managers.faq_a1">It is entered where the work happens: the job is created from the contact card, the receipt is photographed by the person who paid, the property status changes on site. There is no separate act of maintaining it. Check-in and check-out dates genuinely are typed in for now, with Google Calendar import planned.</p>
          </details>
          <details>
            <summary data-i18n="managers.faq_q2">Now the owner is looking over my shoulder.</summary>
            <p data-i18n="managers.faq_a2">They see what you see, which is exactly why they stop asking. The difference between "tell me what is going on" and "I can see what is going on" usually works in your favour.</p>
          </details>
          <details>
            <summary data-i18n="managers.faq_q3">What can I not do?</summary>
            <p data-i18n="managers.faq_a3">Change the organisation's details, edit the company property list, or assign properties to another manager. Everything else is the same as the owner's. Billing is not yours either.</p>
          </details>
        </section>

        <section class="pf-soon" id="soon" aria-labelledby="soon-title">
          <h2 id="soon-title" data-i18n="managers.soon_title">What the app does not do</h2>
          <ul>
            <li data-i18n="managers.soon_1">Import bookings from Google Calendar. Planned. Dates are entered by hand today.</li>
            <li data-i18n="managers.soon_2">Take payment inside a booking request. The guest asks for dates, the host agrees price and payment directly.</li>
            <li data-i18n="managers.soon_3">Connect directly to Airbnb or Booking. Not today and not on the near roadmap.</li>
          </ul>
        </section>
