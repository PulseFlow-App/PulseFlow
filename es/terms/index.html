        <h1 data-i18n="terms.title">Terms of Service</h1>
        <p class="pf-legal-meta" data-i18n="terms.updated">Pulse Flow · Last updated: 2 September 2026</p>

        <p data-i18n="terms.intro">These Terms govern your use of Pulse Flow (the "Service"), including pulseflow.site and app.pulseflow.site. By creating an account or using the Service, you agree to these Terms.</p>

        <h2 data-i18n="terms.summary_title">Summary</h2>
        <ul>
          <li data-i18n="terms.summary_li1">Pulse Flow is operations software for property teams, not a landlord, employer, payment processor, or travel agency.</li>
          <li data-i18n="terms.summary_li2">Keep your login secure and use accurate registration details.</li>
          <li data-i18n="terms.summary_li3">Personal workspaces are free. Company billing applies to the owner when subscriptions are live.</li>
          <li data-i18n="terms.summary_li4">Do not misuse chat, upload harmful content, or process data you are not authorized to handle.</li>
          <li data-i18n="terms.summary_li5">We may update these Terms and suspend accounts that create risk.</li>
        </ul>

        <h2 data-i18n="terms.audiences_title">By role</h2>

        <h3 data-i18n="terms.guest_title">Guest stays and your host</h3>
        <p data-i18n="terms.guest_intro">Stay guests request dates, receive quotes, confirm stays, chat in Support, and track deposits. Your host sets price, deposit rules, and payment instructions.</p>
        <ul>
          <li data-i18n="terms.guest_li1">Deposits are paid directly to your host. Send /deposit in Support with a receipt; your host confirms when received.</li>
          <li data-i18n="terms.guest_li2">Cancel at least 3 days before check-in from Stay home; within 3 days send /cancel in Support.</li>
          <li data-i18n="terms.guest_li3">Your host may cancel if a before-arrival deposit stays unpaid or unconfirmed.</li>
          <li data-i18n="terms.guest_li4">Refunds and house rules are between you and your host.</li>
        </ul>

        <h3 data-i18n="terms.owner_title">Owners and managers</h3>
        <p data-i18n="terms.owner_intro">You operate properties, invite team and guests, and are responsible for rental agreements, pricing, deposits, refunds, and local compliance.</p>
        <ul>
          <li data-i18n="terms.owner_li1">Send clear quotes with deposit timing and payment instructions.</li>
          <li data-i18n="terms.owner_li2">Confirm deposits in Guests or Support after checking receipts.</li>
          <li data-i18n="terms.owner_li3">Manage stays, briefings, and cancellations from Guests.</li>
          <li data-i18n="terms.owner_li4">Managers have the same operational access as owners, except organisation details, editing the company property list, and assigning property access.</li>
        </ul>

        <h3 data-i18n="terms.staff_title">Field staff</h3>
        <p data-i18n="terms.staff_intro">Field staff use the app for assigned properties, jobs, tasks, team chat, and expense bills. Property access and assignments are controlled by the company owner.</p>
        <ul>
          <li data-i18n="terms.staff_li1">Work only on assigned properties and submit bills per your team's rules.</li>
          <li data-i18n="terms.staff_li2">Pulse Flow is not your employer; pay and supervision are with the company you work for.</li>
          <li data-i18n="terms.staff_li3">Listing yourself in staff search is optional and can be switched off at any time.</li>
          <li data-i18n="terms.staff_li4">Guest stay tools are for invited guests and are not part of the field screens.</li>
        </ul>

        <h2 data-i18n="terms.s5_title">Your content and data</h2>
        <p data-i18n="terms.s5_body1">You retain ownership of Customer Content you submit. You grant us a limited license to host and process it solely to operate and improve the Service.</p>
        <p data-i18n="terms.s5_body2">You are responsible for its legality and for complying with local privacy rules when inviting staff or storing guest and property information.</p>

        <h2 data-i18n="terms.s6_title">Billing and referrals</h2>
        <p data-i18n="terms.s6_body">Until checkout is live, registered users receive a 3-month free period from the date of registration. When billing is active, company owners subscribe for gated features; managers, field staff and guests are never charged. Five credited referral joins unlock one year of Full, counted from the day billing starts or the end of your three free months, whichever comes later.</p>

        <h2 data-i18n="terms.s7_title">Disclaimers and liability</h2>
        <p data-i18n="terms.s7_body">The Service is provided "as is". Pulse Flow coordinates operations; it is not legal, tax, accounting, or insurance advice, and it does not determine whether your rental activity is licensed or lawful in your jurisdiction. Our aggregate liability is limited to fees paid in the prior twelve months (or USD 100 if none).</p>

        <h2 data-i18n="terms.s8_title">Changes and termination</h2>
        <p data-i18n="terms.s8_body">We may update these Terms, suspend access, or discontinue features. Continued use after changes means you accept the updated Terms.</p>

        <h2 data-i18n="terms.s9_title">Contact</h2>
        <p data-i18n="terms.s9_body">Questions: <a href="mailto:support@pulseflow.site">support@pulseflow.site</a>. See also our <a href="/es/privacy">Privacy Policy</a>.</p>
