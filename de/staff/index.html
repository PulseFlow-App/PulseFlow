      <main id="main" class="pf-owners-main">
        <section class="pf-owners-hero is-text-only" id="hero">
          <p class="pf-owners-badge" data-i18n="staff.badge">For field staff</p>
          <h1 class="pf-headline" data-i18n="staff.headline">Your jobs for today, in your language</h1>
          <p class="pf-sub" data-i18n="staff.sub">No scrolling back through a chat. Take the job with one tap, send the receipt as a photo, and it all stays in one place.</p>
          <div class="pf-owners-hero-actions">
            <a class="pf-btn-primary" href="https://app.pulseflow.site/register" data-i18n="staff.cta_start">Open Pulse Flow</a>
            <a class="pf-owners-link" href="https://app.pulseflow.site/login?demo=staff" data-i18n="staff.cta_demo">Open the staff demo</a>
          </div>
          <p class="pf-free-note" data-i18n="staff.free_note">It is free for you. The company that invited you pays.</p>
        </section>

        <section class="pf-alt" id="alternative" aria-labelledby="alt-title">
          <h2 id="alt-title" data-i18n="common.alt_title">What breaks today</h2>
          <ul class="pf-alt-list">
            <li data-i18n="staff.alt_1">The job arrived in a chat and scrolled away under everything else.</li>
            <li data-i18n="staff.alt_2">Receipts sit on your phone and you get paid back when someone remembers.</li>
            <li data-i18n="staff.alt_3">The job is written in a language you do not work in.</li>
          </ul>
        </section>

        <section class="pf-guide-section">
          <div class="pf-guide-daily">
            <article class="pf-guide-flagship" id="f1">
              <div class="pf-guide-flagship-copy">
                <h2 data-i18n="staff.f1_title">Only your jobs</h2>
                <p data-i18n="staff.f1_desc">Your home screen shows what is assigned to you: jobs waiting for your confirmation, the properties you have access to, and what is on for today. Nothing that is not yours.</p>
              </div>
              <div class="pf-phone-solo">
                <figure class="pf-phone">
                  <div class="pf-phone-screen">
                    <img
                      src="/assets/screenshots/staff-home.png"
                      width="472"
                      height="1024"
                      alt="Staff home screen: a job waiting to be confirmed"
                      data-i18n-attr="alt:staff.f1_alt"
                      loading="eager"
                    />
                  </div>
                </figure>
              </div>
            </article>
            <article class="pf-guide-flagship" id="f2">
              <div class="pf-guide-flagship-copy">
                <h2 data-i18n="staff.f2_title">One tap and it is yours</h2>
                <p data-i18n="staff.f2_desc">A job only counts as yours once you confirm it. The owner and the manager see that immediately, so nobody has to ask whether you got it.</p>
              </div>
              <div class="pf-phone-solo">
                <figure class="pf-phone">
                  <div class="pf-phone-screen">
                    <img
                      src="/assets/screenshots/staff-jobs.png"
                      width="472"
                      height="1024"
                      alt="A job before confirmation and after"
                      data-i18n-attr="alt:staff.f2_alt"
                      loading="lazy"
                    />
                  </div>
                </figure>
              </div>
            </article>
            <article class="pf-guide-flagship" id="f3">
              <div class="pf-guide-flagship-copy">
                <h2 data-i18n="staff.f3_title">Receipts by photo</h2>
                <p data-i18n="staff.f3_desc">Photograph the receipt, type the amount, send. You can see your own submissions and where they are; the owner approves them. No paper to carry and no reminding anyone.</p>
              </div>
              <div class="pf-phone-solo">
                <figure class="pf-phone">
                  <div class="pf-phone-screen">
                    <img
                      src="/assets/screenshots/staff-bills.png"
                      width="472"
                      height="1024"
                      alt="Submitting an expense: amount, receipt photo and status"
                      data-i18n-attr="alt:staff.f3_alt"
                      loading="lazy"
                    />
                  </div>
                </figure>
              </div>
            </article>
          </div>
        </section>

        <section class="pf-lang-block" id="translation" aria-labelledby="lang-title">
          <div>
            <h2 id="lang-title" data-i18n="staff.lang_title">Jobs arrive in your language</h2>
            <p data-i18n="staff.lang_desc">Pick your language in your profile, and jobs, team chat and messages from the owner arrive in it, even when they were written in another. The content is translated, not just the buttons.</p>
          </div>
          <div class="pf-phone-solo">
            <figure class="pf-phone">
                                <div class="pf-phone-screen">
                    <img
                      src="/assets/screenshots/owner-translate.png"
                      width="472"
                      height="1024"
                      alt="Team content translation setting in the profile"
                      data-i18n-attr="alt:common.lang_alt"
                      loading="lazy"
                    />
                  </div>
            </figure>
          </div>
        </section>

        <section class="pf-lang-block" id="own" aria-labelledby="own-title">
          <div>
            <h2 id="own-title" data-i18n="staff.own_title">What stays yours</h2>
            <p data-i18n="staff.own_desc">Weekly ratings from the owners you work for build a profile. If you want it, switch yourself into staff search and your skills, area, map pin and reviews become visible to other companies nearby. The switch turns off any time. Alongside all of that you can keep your own properties, which have nothing to do with the company.</p>
          </div>
          <div class="pf-phone-solo">
            <figure class="pf-phone">
              <div class="pf-phone-screen">
                <img
                  src="/assets/screenshots/staff-talent-directory.png"
                  width="472"
                  height="1024"
                  alt="Staff search profile: skills, area and visibility switch"
                  data-i18n-attr="alt:staff.own_alt"
                  loading="lazy"
                />
              </div>
            </figure>
          </div>
        </section>
        <section class="pf-features" id="features" aria-labelledby="features-title">
          <details class="pf-features-panel">
            <summary id="features-title" data-i18n="common.features_summary">Feature list — expand all</summary>
            <div class="pf-features-body">
              <div class="pf-features-access">
                <h3 data-i18n="common.features_access_title">What this role can do</h3>
                <ul>
                  <li data-i18n="common.roles_staff_li1">Only the properties assigned to them</li>
                  <li data-i18n="common.roles_staff_li2">Their own jobs and their own submitted receipts</li>
                  <li data-i18n="common.roles_staff_li3">Their own separate properties, invisible to the company</li>
                </ul>
              </div>
              <h3 class="pf-features-more-title" data-i18n="common.more_title">Everything else that already works</h3>
              <div class="pf-more-groups is-two">
              <div class="pf-more-group">
                <h3 data-i18n="staff.more_g1_title">Work</h3>
                <ul>
                  <li data-i18n="staff.more_g1_li1">Assigned properties with status and dates</li>
                  <li data-i18n="staff.more_g1_li2">Jobs with work windows, by property</li>
                  <li data-i18n="staff.more_g1_li3">Team chat with the company</li>
                  <li data-i18n="staff.more_g1_li4">In-app notifications and phone push</li>
                </ul>
              </div>
              <div class="pf-more-group">
                <h3 data-i18n="staff.more_g2_title">Yours</h3>
                <ul>
                  <li data-i18n="staff.more_g2_li1">Your own properties for your own clients</li>
                  <li data-i18n="staff.more_g2_li2">A profile with skills, area and a map pin</li>
                  <li data-i18n="staff.more_g2_li3">Company leaderboard and weekly endorsements</li>
                  <li data-i18n="staff.more_g2_li4">Invite people you know with your own link</li>
                </ul>
              </div>
              </div>
            </div>
          </details>
        </section>

<section class="pf-faq" id="faq" aria-labelledby="faq-title">
          <h2 id="faq-title" data-i18n="common.faq_title">Short answers</h2>
          <details>
            <summary data-i18n="staff.faq_q1">Do I have to install something?</summary>
            <p data-i18n="staff.faq_a1">No. It opens from a link in the browser and goes onto your home screen in one step. No Google Play, no App Store, no new account. An email address is enough.</p>
          </details>
          <details>
            <summary data-i18n="staff.faq_q2">Will my boss see everything about me?</summary>
            <p data-i18n="staff.faq_a2">They see your jobs on their properties and the receipts you send. The properties you keep for yourself are not visible to them. You only appear in staff search if you switch it on.</p>
          </details>
          <details>
            <summary data-i18n="staff.faq_q3">What does it cost me?</summary>
            <p data-i18n="staff.faq_a3">Nothing. A staff seat is always free. The company that invited you pays.</p>
          </details>
        </section>
