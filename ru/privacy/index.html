        <h1 data-i18n="privacy.title">Политика конфиденциальности</h1>
        <p class="pf-legal-meta" data-i18n="privacy.updated">Pulse Flow · Обновлено 3 сентября 2026</p>

        <p data-i18n="privacy.intro">Эта Политика объясняет, как Pulse Flow собирает, использует и передаёт информацию при использовании pulseflow.site, app.pulseflow.site и связанных сервисов («Сервис»).</p>

        <h2 data-i18n="privacy.summary_title">Коротко</h2>
        <ul>
          <li data-i18n="privacy.summary_li1">Мы собираем данные аккаунта, операционные и технические данные, нужные для работы Сервиса.</li>
          <li data-i18n="privacy.summary_li2">Мы используем их, чтобы вас аутентифицировать, дать доступ к функциям и присылать уведомления.</li>
          <li data-i18n="privacy.summary_li3">Мы передаём данные инфраструктурным провайдерам, платёжному сервису после запуска оплаты и участникам вашей команды согласно их ролям.</li>
          <li data-i18n="privacy.summary_li4">Мы не продаём ваши персональные данные.</li>
        </ul>

        <h2 data-i18n="privacy.audiences_title">По ролям</h2>

        <h3 data-i18n="privacy.guest_title">Гостю</h3>
        <ul>
          <li data-i18n="privacy.guest_li1">Мы храним запросы дат, предложенные цены, проживания, статус депозита, брифинги и переписку в Поддержке, включая команды /deposit и /cancel.</li>
          <li data-i18n="privacy.guest_li2">Фотографии чеков из Поддержки хранятся в облачном хранилище.</li>
          <li data-i18n="privacy.guest_li3">Хозяин и его команда видят данные вашего бронирования и переписку в Поддержке по вашему проживанию.</li>
        </ul>

        <h3 data-i18n="privacy.owner_title">Владельцу и управляющему</h3>
        <ul>
          <li data-i18n="privacy.owner_li1">Мы обрабатываем список объектов, задачи, контакты, командный чат, счета, отчёты, проживания гостей и метаданные оплаты вашей организации.</li>
          <li data-i18n="privacy.owner_li2">Сообщения гостей в Поддержке и записи о депозитах видны уполномоченным владельцам и управляющим.</li>
          <li data-i18n="privacy.owner_li3">Идентификаторы клиента и подписки платёжного сервиса хранятся у организации. Номера карт обрабатывает платёжный сервис.</li>
        </ul>

        <h3 data-i18n="privacy.staff_title">Персоналу на объектах</h3>
        <ul>
          <li data-i18n="privacy.staff_li1">Мы храним ваш профиль, назначенные объекты, подтверждения работ, задачи, командный чат, оценки и отправленные счета.</li>
          <li data-i18n="privacy.staff_li2">Фотографии чеков по расходам хранятся в облачном хранилище.</li>
          <li data-i18n="privacy.staff_li3">Размещение в поиске персонала добровольно и может быть видно владельцам и управляющим, которые ищут людей в приложении.</li>
          <li data-i18n="privacy.staff_li4">Данные о проживании гостя доступны только хозяину и самому гостю.</li>
        </ul>

        <h2 data-i18n="privacy.s4_title">Хранение и безопасность</h2>
        <p data-i18n="privacy.s4_body">Мы храним данные, пока организация активна, и разумный срок после этого для резервных копий, споров и требований закона. Передача шифруется, доступ ограничен ролями. Вы можете запросить удаление аккаунта, часть записей может сохраниться там, где этого требует закон.</p>

        <h2 data-i18n="privacy.s5_title">Ваши возможности</h2>
        <ul>
          <li data-i18n="privacy.s5_li1">Менять профиль и настройки организации в приложении</li>
          <li data-i18n="privacy.s5_li2">Управлять корпоративной подпиской или отменять её в биллинг-портале, когда он появится</li>
          <li data-i18n="privacy.s5_li3">Обратиться к нам за доступом к данным, их исправлением или удалением, где это применимо</li>
        </ul>

        <h2 data-i18n="privacy.s6_title">Международное использование и дети</h2>
        <p data-i18n="privacy.s6_body">Данные могут обрабатываться за пределами вашей страны, в регионах, где работают наши провайдеры. Сервис предназначен для рабочих задач и не адресован детям младше 16 лет.</p>

        <h2 data-i18n="privacy.s7_title">Изменения</h2>
        <p data-i18n="privacy.s7_body">Мы можем обновлять эту Политику и публиковать новую дату. Продолжение использования означает согласие с обновлённой Политикой.</p>

        <h2 data-i18n="privacy.s8_title">Контакты</h2>
        <p data-i18n="privacy.s8_body">Вопросы по конфиденциальности: <a href="mailto:support@pulseflow.site">support@pulseflow.site</a>. См. также <a href="/ru/terms">Условия использования</a>.</p>
