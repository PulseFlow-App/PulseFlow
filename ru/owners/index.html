            <li data-i18n="owners.alt_2">Расходы сводятся по фотографиям чеков в переписке, в конце месяца и по памяти.</li>

<section class="pf-faq" id="faq" aria-labelledby="faq-title">
          <h2 id="faq-title" data-i18n="common.faq_title">Короткие ответы</h2>
          <details>
            <summary data-i18n="owners.faq_q1">У меня уже есть Airbnb и Booking. Зачем ещё одно?</summary>
            <p data-i18n="owners.faq_a1">Мы не про брони и не про цены. Брони остаются там, где были. Даты заезда и выезда вносятся вручную, импорт из Google Календаря в планах. Прямой синхронизации с Airbnb и Booking нет.</p>
          </details>
          <details>
            <summary data-i18n="owners.faq_q2">Команда не начнёт этим пользоваться.</summary>
            <p data-i18n="owners.faq_a2">Персонал открывает приложение по ссылке, без магазина приложений и без нового аккаунта. У него свой экран: только его объекты и его работы, на его языке. Места для команды бесплатны, поэтому попробовать ничего не стоит ни вам, ни им.</p>
          </details>
          <details>
            <summary data-i18n="owners.faq_q3">Что с деньгами гостей?</summary>
            <p data-i18n="owners.faq_a3">Оплата и депозит идут напрямую вам, вне приложения. Приложение фиксирует сумму депозита, удержания с фотографией и остаток, и ровно то же видит гость. Оплаты внутри приложения нет.</p>
          </details>
        </section>

        <section class="pf-soon" id="soon" aria-labelledby="soon-title">

            <li data-i18n="owners.soon_1">Импорта броней из Google Календаря. В планах. Сейчас даты вносятся вручную.</li>
            <li data-i18n="owners.soon_2">Оплаты внутри запроса на бронирование. Гость запрашивает даты, цену и оплату вы обсуждаете сами.</li>
            <li data-i18n="owners.soon_3">Прямых интеграций с Airbnb и Booking. Их нет и в ближайших планах тоже.</li>
          </ul>
        </section>

        </section>
