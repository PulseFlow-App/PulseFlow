        <section class="pf-features" id="features" aria-labelledby="features-title">
          <details class="pf-features-panel">
            <summary id="features-title" data-i18n="common.features_summary">Список возможностей — раскрыть всё</summary>
            <div class="pf-features-body">
              <div class="pf-features-access">
                <h3 data-i18n="common.features_access_title">Что доступно этой роли</h3>
                <ul>
                  <li data-i18n="common.roles_guest_li1">Своя вилла, свои даты и гид по дому</li>
                  <li data-i18n="common.roles_guest_li2">Свой депозит, удержания и остаток</li>
                  <li data-i18n="common.roles_guest_li3">Чат только с хозяином, полевой команды в нём нет</li>
                </ul>
              </div>
              <h3 class="pf-features-more-title" data-i18n="guests.more_title">Что ещё есть</h3>
              <div class="pf-more-groups is-two">
              <div class="pf-more-group">
                <ul>
                  <li data-i18n="guests.o1">Чат с хозяином, который открывается, когда проживание подтверждено. Уборщиков и подрядчиков в нём нет.</li>
                  <li data-i18n="guests.o2">Фотографии на заезде и выезде, если понадобится что-то зафиксировать.</li>
                  <li data-i18n="guests.o3">Виллы этого же хозяина и запрос дат напрямую на следующий раз.</li>
                  <li data-i18n="guests.o4">Уведомления на телефон, если включите.</li>
                </ul>
              </div>
              </div>
            </div>

<section class="pf-faq" id="faq" aria-labelledby="faq-title">
          <h2 id="faq-title" data-i18n="common.faq_title">Короткие ответы</h2>
          <details>
            <summary data-i18n="guests.faq_q1">Надо что-то устанавливать?</summary>
            <p data-i18n="guests.faq_a1">Нет. Открываете ссылку от хозяина в браузере. При желании приложение добавляется на экран телефона одним действием.</p>
          </details>
          <details>
            <summary data-i18n="guests.faq_q2">Я плачу через приложение?</summary>
            <p data-i18n="guests.faq_a2">Нет. Депозит и оплата идут напрямую хозяину так, как вы с ним договорились. Приложение показывает суммы, удержания и остаток, чтобы у вас и у него была одна версия.</p>
          </details>
          <details>
            <summary data-i18n="guests.faq_q3">Могу забронировать следующий приезд?</summary>
            <p data-i18n="guests.faq_a3">Можно отправить хозяину запрос на даты прямо из приложения, он ответит ценой. Это не бронирование в один клик и не платёж, это прямой запрос без площадки и её комиссии.</p>
          </details>
        </section>
