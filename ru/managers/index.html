          <p class="pf-sub" data-i18n="managers.sub">Что горит сегодня, кто на объекте, какие заезды и какие счета висят. Владелец видит ту же картину и перестаёт спрашивать.</p>

            <li data-i18n="managers.alt_3">Уборщица не увидела сообщение, и вы узнаёте об этом от гостя.</li>

<section class="pf-faq" id="faq" aria-labelledby="faq-title">
          <h2 id="faq-title" data-i18n="common.faq_title">Короткие ответы</h2>
          <details>
            <summary data-i18n="managers.faq_q1">Ещё одна система, куда всё надо вносить руками.</summary>
            <p data-i18n="managers.faq_a1">Вносится там же, где работается: заказ создаётся из карточки контакта, чек фотографирует тот, кто платил, статус объекта меняется на объекте. Отдельного «ведения системы» нет. Даты заезда и выезда пока действительно вводятся вручную, импорт из Google Календаря в планах.</p>
          </details>
          <details>
            <summary data-i18n="managers.faq_q2">Владелец теперь будет смотреть мне через плечо.</summary>
            <p data-i18n="managers.faq_a2">Он видит ту же картину, что и вы, и именно поэтому перестаёт спрашивать. Разница между «расскажи, что происходит» и «я вижу, что происходит» обычно в вашу пользу.</p>
          </details>
          <details>
            <summary data-i18n="managers.faq_q3">Что я не смогу сделать?</summary>
            <p data-i18n="managers.faq_a3">Изменить данные организации, отредактировать список объектов компании и назначить объекты другому управляющему. Всё остальное у вас как у владельца. Биллинг тоже не ваш.</p>
          </details>
        </section>

        <section class="pf-soon" id="soon" aria-labelledby="soon-title">

            <li data-i18n="managers.soon_1">Импорта броней из Google Календаря. В планах. Сейчас даты вносятся вручную.</li>
            <li data-i18n="managers.soon_2">Оплаты внутри запроса на бронирование. Гость запрашивает даты, цену и оплату хозяин обсуждает напрямую.</li>
            <li data-i18n="managers.soon_3">Прямых интеграций с Airbnb и Booking. Их нет и в ближайших планах тоже.</li>
          </ul>
