        <section class="pf-faq" id="faq" aria-labelledby="faq-title">
          <h2 id="faq-title" data-i18n="home.faq_title">Короткие ответы</h2>
          <details>
            <summary data-i18n="home.faq_q1">У меня всё в Airbnb и Booking. Это замена?</summary>
            <p data-i18n="home.faq_a1">Нет. Брони остаются там, где они есть. Pulse Flow про то, что происходит после брони: кто убирает, что сломалось, сколько потрачено и что видит гость. Даты заезда и выезда сейчас вносятся вручную. Импорт из Google Календаря в планах. Прямой синхронизации с Airbnb и Booking нет.</p>
          </details>
          <details>
            <summary data-i18n="home.faq_q2">Сколько это стоит?</summary>
            <p data-i18n="home.faq_a2">Личное пространство бесплатно навсегда. За компанию платит только владелец, места команды бесплатны. Оплата ещё не подключена, все зарегистрированные аккаунты получают 3 месяца полного доступа.</p>
          </details>
          <details>
            <summary data-i18n="home.faq_q3">Персонал не будет ставить приложение.</summary>
            <p data-i18n="home.faq_a3">Ставить из магазина ничего не надо. Приложение открывается по ссылке в браузере и добавляется на экран телефона одним действием. Ни Google-аккаунта, ни App Store, только почта. Интерфейс переключается на язык человека, а задачи и чат он читает на своём языке.</p>
          </details>
          <details>
