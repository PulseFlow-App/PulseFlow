        <h1 data-i18n="terms.title">Условия использования</h1>
        <p class="pf-legal-meta" data-i18n="terms.updated">Pulse Flow · Обновлено 3 сентября 2026</p>

        <p data-i18n="terms.intro">Эти Условия регулируют использование Pulse Flow («Сервис»), включая pulseflow.site и app.pulseflow.site. Создавая аккаунт или пользуясь Сервисом, вы соглашаетесь с этими Условиями.</p>

        <h2 data-i18n="terms.summary_title">Коротко</h2>
        <ul>
          <li data-i18n="terms.summary_li1">Pulse Flow это программа для операций по объектам аренды. Мы не арендодатель, не работодатель, не платёжный сервис и не турагентство.</li>
          <li data-i18n="terms.summary_li2">Храните доступ к аккаунту в безопасности и указывайте достоверные данные при регистрации.</li>
          <li data-i18n="terms.summary_li3">Личные пространства бесплатны. Когда оплата заработает, за корпоративное пространство платит владелец.</li>
          <li data-i18n="terms.summary_li4">Не злоупотребляйте чатом, не загружайте вредоносное и не обрабатывайте данные, на которые у вас нет прав.</li>
          <li data-i18n="terms.summary_li5">Мы можем обновлять эти Условия и приостанавливать аккаунты, создающие риск.</li>
        </ul>

        <h2 data-i18n="terms.audiences_title">По ролям</h2>

        <h3 data-i18n="terms.guest_title">Гостю и его хозяину</h3>
        <p data-i18n="terms.guest_intro">Гость запрашивает даты, получает цену, подтверждает проживание, пишет в Поддержку и следит за депозитом. Цену, правила депозита и порядок оплаты устанавливает хозяин.</p>
        <ul>
          <li data-i18n="terms.guest_li1">Депозит платится напрямую хозяину. Отправьте /deposit в Поддержку с чеком, хозяин подтвердит получение.</li>
          <li data-i18n="terms.guest_li2">Отменить можно не позднее чем за 3 дня до заезда с главного экрана проживания. Если осталось меньше трёх дней, отправьте /cancel в Поддержку.</li>
          <li data-i18n="terms.guest_li3">Хозяин может отменить проживание, если депозит до заезда не оплачен или не подтверждён.</li>
          <li data-i18n="terms.guest_li4">Возвраты и правила дома это вопрос между вами и хозяином.</li>
        </ul>

        <h3 data-i18n="terms.owner_title">Владельцу и управляющему</h3>
        <p data-i18n="terms.owner_intro">Вы ведёте объекты, приглашаете команду и гостей и отвечаете за договоры аренды, цены, депозиты, возвраты и соблюдение местных требований.</p>
        <ul>
          <li data-i18n="terms.owner_li1">Отправляйте понятную цену с указанием сроков депозита и порядка оплаты.</li>
          <li data-i18n="terms.owner_li2">Подтверждайте депозит в разделе гостей или в Поддержке после проверки чека.</li>
          <li data-i18n="terms.owner_li3">Управляйте проживаниями, брифингами и отменами из раздела гостей.</li>
          <li data-i18n="terms.owner_li4">У управляющего тот же операционный доступ, что у владельца, кроме данных организации, редактирования списка объектов компании и раздачи доступа к объектам.</li>
        </ul>

        <h3 data-i18n="terms.staff_title">Персоналу на объектах</h3>
        <p data-i18n="terms.staff_intro">Персонал пользуется приложением для назначенных объектов, работ, задач, командного чата и счетов на возмещение. Доступ к объектам и назначения задаёт владелец компании.</p>
        <ul>
          <li data-i18n="terms.staff_li1">Работайте только на назначенных объектах и отправляйте счета по правилам вашей команды.</li>
          <li data-i18n="terms.staff_li2">Pulse Flow не ваш работодатель. Оплата и руководство остаются за компанией, на которую вы работаете.</li>
          <li data-i18n="terms.staff_li3">Размещение себя в поиске персонала добровольно и отключается в любой момент.</li>
          <li data-i18n="terms.staff_li4">Гостевые инструменты предназначены приглашённым гостям и не входят в полевые экраны.</li>
        </ul>

        <h2 data-i18n="terms.s5_title">Ваш контент и данные</h2>
        <p data-i18n="terms.s5_body1">Права на загружаемый контент остаются за вами. Вы даёте нам ограниченную лицензию хранить и обрабатывать его исключительно для работы и улучшения Сервиса.</p>
        <p data-i18n="terms.s5_body2">Вы отвечаете за законность контента и за соблюдение местных правил о персональных данных, когда приглашаете персонал или храните данные гостей и объектов.</p>

        <h2 data-i18n="terms.s6_title">Оплата и рефералы</h2>
        <p data-i18n="terms.s6_body">Пока оплата не подключена, каждый зарегистрированный пользователь получает 3 месяца полного доступа с даты регистрации. Когда оплата заработает, подписку оформляет владелец компании. Управляющие, персонал и гости не платят никогда. Пять зачтённых приглашений открывают год Full, отсчёт идёт с даты запуска оплаты или с конца ваших трёх бесплатных месяцев, смотря что позже.</p>

        <h2 data-i18n="terms.s7_title">Отказ от гарантий и ответственность</h2>
        <p data-i18n="terms.s7_body">Сервис предоставляется «как есть». Pulse Flow помогает координировать работу. Это не юридическая, налоговая, бухгалтерская или страховая консультация, и Сервис не определяет, лицензирована ли и законна ли ваша арендная деятельность в вашей юрисдикции. Совокупная ответственность ограничена суммой, уплаченной за предыдущие двенадцать месяцев, либо 100 USD, если оплаты не было.</p>

        <h2 data-i18n="terms.s8_title">Изменения и прекращение</h2>
        <p data-i18n="terms.s8_body">Мы можем обновлять эти Условия, приостанавливать доступ и прекращать поддержку отдельных функций. Продолжение использования после изменений означает согласие с обновлёнными Условиями.</p>
