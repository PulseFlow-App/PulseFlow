      <main id="main" class="pf-owners-main">
        <section class="pf-owners-hero is-text-only" id="hero">
          <p class="pf-owners-badge" data-i18n="staff.badge">Для персонала на объектах</p>
          <h1 class="pf-headline" data-i18n="staff.headline">Ваши работы на сегодня, на вашем языке</h1>
          <p class="pf-sub" data-i18n="staff.sub">Не искать в переписке. Приняли работу нажатием, отправили чек фотографией, и всё это осталось в приложении.</p>
          <div class="pf-owners-hero-actions">
            <a class="pf-btn-primary" href="https://app.pulseflow.site/register" data-i18n="staff.cta_start">Открыть Pulse Flow</a>
            <a class="pf-owners-link" href="https://app.pulseflow.site/login?demo=staff" data-i18n="staff.cta_demo">Открыть демо сотрудника</a>
          </div>
          <p class="pf-free-note" data-i18n="staff.free_note">Для вас приложение бесплатное. Платит компания, которая вас пригласила.</p>
        </section>

        <section class="pf-alt" id="alternative" aria-labelledby="alt-title">
          <h2 id="alt-title" data-i18n="common.alt_title">Что ломается сейчас</h2>
          <ul class="pf-alt-list">
            <li data-i18n="staff.alt_1">Задание пришло в чат и уехало вверх под другими сообщениями.</li>
            <li data-i18n="staff.alt_2">Чеки лежат в телефоне, а деньги возвращают, когда вспомнят.</li>
            <li data-i18n="staff.alt_3">Задание написано на языке, на котором вы не работаете.</li>
          </ul>
        </section>

        <section class="pf-guide-section">
          <div class="pf-guide-daily">
            <article class="pf-guide-flagship" id="f1">
              <div class="pf-guide-flagship-copy">
                <h2 data-i18n="staff.f1_title">Только ваши работы</h2>
                <p data-i18n="staff.f1_desc">На главном экране то, что назначено вам: работы, ждущие подтверждения, объекты, к которым у вас есть доступ, и что на сегодня. Чужого здесь нет.</p>
              </div>
              <div class="pf-phone-solo">
                <figure class="pf-phone">
                  <div class="pf-phone-screen">
                    <img
                      src="/assets/screenshots/staff-home.png"
                      width="472"
                      height="1024"
                      alt="Домашний экран сотрудника: работа, ожидающая подтверждения"
                      data-i18n-attr="alt:staff.f1_alt"
                      loading="eager"
                    />
                  </div>
                </figure>
              </div>
            </article>
            <article class="pf-guide-flagship" id="f2">
              <div class="pf-guide-flagship-copy">
                <h2 data-i18n="staff.f2_title">Приняли одним нажатием</h2>
                <p data-i18n="staff.f2_desc">Работа считается вашей только после того, как вы её подтвердили. Владелец и управляющий видят это сразу, и вопрос «ты получил?» отпадает.</p>
              </div>
              <div class="pf-phone-solo">
                <figure class="pf-phone">
                  <div class="pf-phone-screen">
                    <img
                      src="/assets/screenshots/staff-jobs.png"
                      width="472"
                      height="1024"
                      alt="Работа до подтверждения и после"
                      data-i18n-attr="alt:staff.f2_alt"
                      loading="lazy"
                    />
                  </div>
                </figure>
              </div>
            </article>
            <article class="pf-guide-flagship" id="f3">
              <div class="pf-guide-flagship-copy">
                <h2 data-i18n="staff.f3_title">Чек фотографией</h2>
                <p data-i18n="staff.f3_desc">Сфотографировали чек, указали сумму, отправили. Вы видите свои заявки и их статус, утверждает владелец. Носить бумажки и напоминать о себе не нужно.</p>
              </div>
              <div class="pf-phone-solo">
                <figure class="pf-phone">
                  <div class="pf-phone-screen">
                    <img
                      src="/assets/screenshots/staff-bills.png"

                      height="1024"
                      alt="Отправка расхода: сумма, фото чека и статус заявки"
                      data-i18n-attr="alt:staff.f3_alt"
                      loading="lazy"
                    />
                  </div>
                </figure>
              </div>
            </article>
          </div>

            <h2 id="lang-title" data-i18n="staff.lang_title">Задачи приходят на вашем языке</h2>
            <p data-i18n="staff.lang_desc">Выберите язык в профиле, и задачи, командный чат и сообщения от владельца будут приходить на нём, даже если написаны на другом. Переводится содержание, а не только кнопки.</p>

            <h2 id="own-title" data-i18n="staff.own_title">Что остаётся вашим</h2>
            <p data-i18n="staff.own_desc">Оценки от владельцев за неделю собираются в профиль. Если захотите, включите себя в поиск персонала: навыки, район, отметка на карте и отзывы станут видны другим компаниям поблизости. Тумблер выключается в любой момент. Рядом можно вести свои объекты, к компании они отношения не имеют.</p>

                  <li data-i18n="staff.more_g1_li2">Работы с окнами времени по объектам</li>
                  <li data-i18n="staff.more_g1_li3">Командный чат с компанией</li>
                  <li data-i18n="staff.more_g1_li4">Уведомления в приложении и push на телефон</li>
                </ul>
              </div>

                  <li data-i18n="staff.more_g2_li3">Рейтинг компании и оценки за неделю</li>

<section class="pf-faq" id="faq" aria-labelledby="faq-title">
          <h2 id="faq-title" data-i18n="common.faq_title">Короткие ответы</h2>
          <details>
            <summary data-i18n="staff.faq_q1">Мне надо что-то устанавливать?</summary>
            <p data-i18n="staff.faq_a1">Нет. Приложение открывается по ссылке в браузере и добавляется на экран телефона одним действием. Ни Google Play, ни App Store, ни новый аккаунт. Нужна только почта.</p>
          </details>
          <details>
            <summary data-i18n="staff.faq_q2">Начальник увидит про меня всё?</summary>
            <p data-i18n="staff.faq_a2">Он видит ваши работы по своим объектам и ваши чеки. Ваши собственные объекты, которые вы ведёте отдельно, ему не видны. В поиск персонала вы попадаете только если сами включите тумблер.</p>
          </details>
          <details>
            <summary data-i18n="staff.faq_q3">Сколько это стоит мне?</summary>
            <p data-i18n="staff.faq_a3">Нисколько. Место сотрудника бесплатное всегда. Платит компания, которая вас пригласила.</p>
          </details>
        </section>
