                  <li data-i18n="common.roles_guest_li2">Their deposit, deductions and balance</li>
                  <li data-i18n="common.roles_guest_li3">A chat with the host only, never with the field team</li>
                </ul>
              </div>
              <h3 class="pf-features-more-title" data-i18n="guests.more_title">What else is there</h3>
              <div class="pf-more-groups is-two">
              <div class="pf-more-group">
                <ul>
                  <li data-i18n="guests.o1">A chat with your host that opens once your stay is confirmed. Cleaners and contractors are not in it.</li>
                  <li data-i18n="guests.o2">Arrival and departure photos, if something is worth recording.</li>
                  <li data-i18n="guests.o3">The same host's other villas, and a direct date request for next time.</li>
                  <li data-i18n="guests.o4">Phone notifications, if you turn them on.</li>
                </ul>
              </div>
              </div>

<section class="pf-faq" id="faq" aria-labelledby="faq-title">
          <h2 id="faq-title" data-i18n="common.faq_title">Short answers</h2>
          <details>
            <summary data-i18n="guests.faq_q1">Do I need to install anything?</summary>
            <p data-i18n="guests.faq_a1">No. You open your host's link in a browser. If you want, it goes onto your home screen in one step.</p>
          </details>
          <details>
            <summary data-i18n="guests.faq_q2">Do I pay through the app?</summary>
            <p data-i18n="guests.faq_a2">No. Your deposit and payment go straight to your host, however the two of you agreed. The app shows the amounts, the deductions and the balance so that you both have the same version.</p>
          </details>
          <details>
            <summary data-i18n="guests.faq_q3">Can I book my next stay here?</summary>
            <p data-i18n="guests.faq_a3">You can send your host a date request from the app and they reply with a price. It is not one-click booking and it is not a payment, it is a direct request without a platform and its fee.</p>
          </details>
        </section>
